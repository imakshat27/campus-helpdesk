[project]
name = "campus-helpdesk-api"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "sentence-transformers>=3.4,<6",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.21.2",
    "markdownify>=1.2.3",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
